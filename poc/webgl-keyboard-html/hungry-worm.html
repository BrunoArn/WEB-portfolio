<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | Hungry Worm</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no" />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: relative;
    }

    #unity-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" width=960 height=640 tabindex="0" aria-label="Hungry Worm"
    style="background: #231F20"></canvas>
  <script>
    // Let the browser move focus across the iframe boundary.
    // Capture before Unity handles Tab; keep the native default action intact.
    window.addEventListener("keydown", function allowNativeTab(event) {
      if (event.key !== "Tab" || event.ctrlKey || event.altKey || event.metaKey || event.isComposing) return;
      const active = document.activeElement;
      const canvas = document.getElementById("unity-canvas");
      if (active !== canvas && active !== document.body && active !== document.documentElement) return;
      event.stopImmediatePropagation();
    }, true);
  </script>
  <script src="Build/Hungry-Worm.loader.js"></script>
  <script>
    createUnityInstance(document.querySelector("#unity-canvas"), {
      arguments: [],
      dataUrl: "Build/Hungry-Worm.data.br",
      frameworkUrl: "Build/Hungry-Worm.framework.js.br",
        codeUrl: "Build/Hungry-Worm.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
      companyName: "Bruno Arnaud",
      productName: "Hungry Worm",
      productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
  </script>
</body>

</html>
